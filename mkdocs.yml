site_name: RepoLens Cursor Edition
site_description: >-
  Operator guide, IDE handoff, toolgate tools, and CLI reference for
  RepoLens Cursor Edition — multi-lens audits in Cursor IDE.
site_url: https://benjarogit.github.io/RepoLens-Cursor-Edition/
site_author: benjarogit

repo_url: https://github.com/benjarogit/RepoLens-Cursor-Edition
repo_name: benjarogit/RepoLens-Cursor-Edition
edit_uri: edit/master/docs/

copyright: >-
  Apache-2.0 ·
  <a href="https://github.com/TheMorpheus407/RepoLens">Upstream RepoLens</a> ·
  Cursor Edition docs

docs_dir: docs
site_dir: site

exclude_docs: |
  README.md

validation:
  links:
    absolute_links: ignore
    unrecognized_links: ignore
    not_found: ignore

theme:
  name: material
  language: en
  # Light mark for teal/navy header (logo-dark = pale aperture)
  logo: assets/logo-dark.png
  favicon: assets/logo-light.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # Auto → light → dark (same pattern as Material docs)
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
          site_name: RepoLens Cursor Edition
        - locale: de
          name: Deutsch
          build: true
          site_name: RepoLens Cursor Edition
          nav_translations:
            Home: Start
            Getting started: Einstieg
            Reference: Referenz
            Project: Projekt
            Operator guide: Operator-Guide
            IDE handoff: IDE-Handoff
            Toolgate tools: Toolgate-Tools
            CLI & modes: CLI & Modes
            Finding registry: Finding-Registry
            Releasing: Releases
            Upstream sync: Upstream-Sync
            Changelog: Changelog
            Methodology: Methodik
            Contributing: Mitwirken

nav:
  - Home: index.md
  - Getting started:
      - Operator guide: operator.md
      - IDE handoff: handoff.md
      - Toolgate tools: toolgate-tools.md
  - Reference:
      - CLI & modes: full-reference.md
      - Finding registry: finding-registry-schema.md
  - Project:
      - Releasing: releasing.md
      - Upstream sync: https://github.com/benjarogit/RepoLens-Cursor-Edition/blob/master/UPSTREAM.md
      - Changelog: https://github.com/benjarogit/RepoLens-Cursor-Edition/blob/master/CHANGELOG.md
      - Methodology: https://github.com/benjarogit/RepoLens-Cursor-Edition/blob/master/METHODOLOGY.md
      - Contributing: https://github.com/benjarogit/RepoLens-Cursor-Edition/blob/master/CONTRIBUTING.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/benjarogit/RepoLens-Cursor-Edition
      name: GitHub
    - icon: fontawesome/brands/markdown
      link: https://benjarogit.github.io/RepoLens-Cursor-Edition/
      name: Documentation
  generator: false
